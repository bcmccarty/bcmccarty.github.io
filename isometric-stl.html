<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isometric Saint Louis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas {
            display: block;
            cursor: grab;
        }

        #canvas:active {
            cursor: grabbing;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 24px;
            background: linear-gradient(to bottom, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0) 100%);
            z-index: 100;
            pointer-events: none;
        }

        .header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
        }

        .controls {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .info-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(20,20,30,0.9);
            border-radius: 16px;
            padding: 16px 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            min-width: 200px;
        }

        .info-panel .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .info-panel .stat:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .info-panel .stat-label {
            font-size: 0.8rem;
            color: #888;
        }

        .info-panel .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: #fff;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: #888;
        }

        .tooltip {
            position: fixed;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.15s ease;
            max-width: 250px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tooltip.show {
            opacity: 1;
        }

        .tooltip .building-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .tooltip .building-info {
            color: #888;
            font-size: 0.75rem;
        }

        .legend {
            position: fixed;
            top: 90px;
            left: 24px;
            background: rgba(20,20,30,0.9);
            border-radius: 12px;
            padding: 14px 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .legend-title {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 6px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .landmarks-btn {
            position: fixed;
            top: 90px;
            right: 24px;
            background: rgba(20,20,30,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.15s ease;
        }

        .landmarks-btn:hover {
            background: rgba(40,40,60,0.9);
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.1rem; }
            .info-panel {
                right: 12px;
                left: 12px;
                bottom: 12px;
            }
            .controls {
                left: 12px;
                bottom: 100px;
            }
            .legend {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ISOMETRIC STL</h1>
        <div class="subtitle">Saint Louis, Missouri</div>
    </div>

    <div class="legend">
        <div class="legend-title">Building Height</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #1e3a5f"></div>
            <span>1-2 floors</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2563eb"></div>
            <span>3-5 floors</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #7c3aed"></div>
            <span>6-15 floors</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #db2777"></div>
            <span>16-30 floors</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #f59e0b"></div>
            <span>30+ floors</span>
        </div>
    </div>

    <button class="landmarks-btn" onclick="goToLandmark()">Landmarks</button>

    <div class="controls">
        <button class="control-btn" onclick="zoomIn()" title="Zoom In">+</button>
        <button class="control-btn" onclick="zoomOut()" title="Zoom Out">-</button>
        <button class="control-btn" onclick="resetView()" title="Reset View">&#8634;</button>
    </div>

    <div class="info-panel">
        <div class="stat">
            <span class="stat-label">Buildings</span>
            <span class="stat-value" id="building-count">-</span>
        </div>
        <div class="stat">
            <span class="stat-label">Zoom</span>
            <span class="stat-value" id="zoom-level">1.0x</span>
        </div>
        <div class="stat">
            <span class="stat-label">Area</span>
            <span class="stat-value">Downtown STL</span>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Saint Louis...</div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="building-name" id="tooltip-name"></div>
        <div class="building-info" id="tooltip-info"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // State
        let buildings = [];
        let zoom = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let hoveredBuilding = null;

        // Saint Louis downtown coordinates (centered on Gateway Arch area)
        const CENTER_LAT = 38.6247;
        const CENTER_LON = -90.1848;
        const SCALE = 80000; // Meters to pixels

        // Color scheme based on height
        function getColor(height) {
            if (height > 100) return { top: '#fbbf24', left: '#d97706', right: '#92400e' }; // Gold - skyscrapers
            if (height > 50) return { top: '#f472b6', left: '#db2777', right: '#9d174d' }; // Pink - tall
            if (height > 20) return { top: '#a78bfa', left: '#7c3aed', right: '#5b21b6' }; // Purple - medium
            if (height > 10) return { top: '#60a5fa', left: '#2563eb', right: '#1d4ed8' }; // Blue - small
            return { top: '#3b82f6', left: '#1e3a5f', right: '#172554' }; // Dark blue - low
        }

        // Convert lat/lon to screen coordinates
        function latLonToScreen(lat, lon) {
            const x = (lon - CENTER_LON) * SCALE * Math.cos(CENTER_LAT * Math.PI / 180);
            const y = -(lat - CENTER_LAT) * SCALE;
            return { x, y };
        }

        // Isometric projection
        function toIsometric(x, y, z) {
            const isoX = (x - y) * Math.cos(Math.PI / 6);
            const isoY = (x + y) * Math.sin(Math.PI / 6) - z;
            return { x: isoX, y: isoY };
        }

        // Apply view transforms
        function applyTransform(point) {
            return {
                x: (point.x * zoom) + canvas.width / 2 + offsetX,
                y: (point.y * zoom) + canvas.height / 2 + offsetY
            };
        }

        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }

        // Parse OSM building outline
        function parseBuilding(element) {
            if (!element.geometry) return null;

            const coords = element.geometry.map(node => {
                const screen = latLonToScreen(node.lat, node.lon);
                return { x: screen.x, y: screen.y };
            });

            // Get building height
            let height = 10; // Default height
            const tags = element.tags || {};

            if (tags.height) {
                height = parseFloat(tags.height) || 10;
            } else if (tags['building:levels']) {
                height = parseFloat(tags['building:levels']) * 3.5;
            } else if (tags.building === 'skyscraper') {
                height = 150;
            } else if (tags.building === 'tower') {
                height = 80;
            } else if (tags.building === 'office' || tags.building === 'commercial') {
                height = 25;
            } else if (tags.building === 'apartments' || tags.building === 'residential') {
                height = 15;
            }

            // Get building name
            const name = tags.name || tags['addr:street'] || null;

            // Calculate centroid for sorting
            let cx = 0, cy = 0;
            coords.forEach(c => { cx += c.x; cy += c.y; });
            cx /= coords.length;
            cy /= coords.length;

            return {
                coords,
                height,
                name,
                tags,
                centroidX: cx,
                centroidY: cy
            };
        }

        // Fetch building data from OpenStreetMap
        async function fetchBuildings() {
            const bbox = `${CENTER_LAT - 0.025},${CENTER_LON - 0.035},${CENTER_LAT + 0.025},${CENTER_LON + 0.035}`;

            const query = `
                [out:json][timeout:60];
                (
                    way["building"](${bbox});
                    relation["building"](${bbox});
                );
                out body;
                >;
                out skel qt;
            `;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: 'data=' + encodeURIComponent(query)
                });

                if (!response.ok) throw new Error('Failed to fetch data');

                const data = await response.json();

                // Build node lookup
                const nodes = {};
                data.elements.forEach(el => {
                    if (el.type === 'node') {
                        nodes[el.id] = { lat: el.lat, lon: el.lon };
                    }
                });

                // Process buildings
                const processedBuildings = [];
                data.elements.forEach(el => {
                    if (el.type === 'way' && el.nodes) {
                        el.geometry = el.nodes.map(nodeId => nodes[nodeId]).filter(n => n);
                        const building = parseBuilding(el);
                        if (building && building.coords.length >= 3) {
                            processedBuildings.push(building);
                        }
                    }
                });

                // Sort by depth (back to front for isometric)
                processedBuildings.sort((a, b) => {
                    return (a.centroidX + a.centroidY) - (b.centroidX + b.centroidY);
                });

                return processedBuildings;

            } catch (error) {
                console.error('Error fetching buildings:', error);
                return generateFallbackBuildings();
            }
        }

        // Generate fallback buildings if API fails
        function generateFallbackBuildings() {
            const buildings = [];

            // Saint Louis landmarks approximation
            const landmarks = [
                // Gateway Arch area
                { x: 0, y: 0, w: 50, d: 50, h: 192, name: 'Gateway Arch' },
                // Old Courthouse
                { x: -200, y: 100, w: 80, d: 80, h: 60, name: 'Old Courthouse' },
                // Downtown buildings
                { x: -400, y: 200, w: 60, d: 60, h: 180, name: 'One Metropolitan Square' },
                { x: -300, y: 300, w: 50, d: 50, h: 150, name: 'AT&T Tower' },
                { x: -500, y: 150, w: 55, d: 55, h: 130, name: 'US Bank Plaza' },
                // Ballpark Village area
                { x: -600, y: -100, w: 200, d: 150, h: 20, name: 'Busch Stadium' },
            ];

            landmarks.forEach(lm => {
                const coords = [
                    { x: lm.x, y: lm.y },
                    { x: lm.x + lm.w, y: lm.y },
                    { x: lm.x + lm.w, y: lm.y + lm.d },
                    { x: lm.x, y: lm.y + lm.d },
                    { x: lm.x, y: lm.y }
                ];
                buildings.push({
                    coords,
                    height: lm.h,
                    name: lm.name,
                    centroidX: lm.x + lm.w / 2,
                    centroidY: lm.y + lm.d / 2,
                    tags: {}
                });
            });

            // Generate random fill buildings
            for (let i = 0; i < 500; i++) {
                const x = (Math.random() - 0.5) * 1500;
                const y = (Math.random() - 0.5) * 1500;
                const w = 20 + Math.random() * 40;
                const d = 20 + Math.random() * 40;
                const h = 8 + Math.random() * 30;

                const coords = [
                    { x, y },
                    { x: x + w, y },
                    { x: x + w, y: y + d },
                    { x, y: y + d },
                    { x, y }
                ];

                buildings.push({
                    coords,
                    height: h,
                    name: null,
                    centroidX: x + w / 2,
                    centroidY: y + d / 2,
                    tags: {}
                });
            }

            buildings.sort((a, b) => (a.centroidX + a.centroidY) - (b.centroidX + b.centroidY));
            return buildings;
        }

        // Draw a single building
        function drawBuilding(building) {
            const { coords, height } = building;
            const colors = getColor(height);
            const heightScale = zoom * 0.5;

            // Get screen coordinates for base
            const basePoints = coords.map(c => {
                const iso = toIsometric(c.x, c.y, 0);
                return applyTransform(iso);
            });

            // Get screen coordinates for top
            const topPoints = coords.map(c => {
                const iso = toIsometric(c.x, c.y, height * heightScale);
                return applyTransform(iso);
            });

            // Draw left faces
            for (let i = 0; i < coords.length - 1; i++) {
                const dx = coords[i + 1].x - coords[i].x;
                const dy = coords[i + 1].y - coords[i].y;

                // Determine if face is visible (left-facing for isometric)
                if (dx >= 0 && dy <= 0) {
                    ctx.beginPath();
                    ctx.moveTo(basePoints[i].x, basePoints[i].y);
                    ctx.lineTo(basePoints[i + 1].x, basePoints[i + 1].y);
                    ctx.lineTo(topPoints[i + 1].x, topPoints[i + 1].y);
                    ctx.lineTo(topPoints[i].x, topPoints[i].y);
                    ctx.closePath();
                    ctx.fillStyle = colors.left;
                    ctx.fill();
                }
            }

            // Draw right faces
            for (let i = 0; i < coords.length - 1; i++) {
                const dx = coords[i + 1].x - coords[i].x;
                const dy = coords[i + 1].y - coords[i].y;

                if (dx <= 0 && dy >= 0) {
                    ctx.beginPath();
                    ctx.moveTo(basePoints[i].x, basePoints[i].y);
                    ctx.lineTo(basePoints[i + 1].x, basePoints[i + 1].y);
                    ctx.lineTo(topPoints[i + 1].x, topPoints[i + 1].y);
                    ctx.lineTo(topPoints[i].x, topPoints[i].y);
                    ctx.closePath();
                    ctx.fillStyle = colors.right;
                    ctx.fill();
                }
            }

            // Draw top face
            ctx.beginPath();
            ctx.moveTo(topPoints[0].x, topPoints[0].y);
            for (let i = 1; i < topPoints.length; i++) {
                ctx.lineTo(topPoints[i].x, topPoints[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = colors.top;
            ctx.fill();

            // Store screen bounds for hover detection
            building.screenBounds = {
                minX: Math.min(...topPoints.map(p => p.x), ...basePoints.map(p => p.x)),
                maxX: Math.max(...topPoints.map(p => p.x), ...basePoints.map(p => p.x)),
                minY: Math.min(...topPoints.map(p => p.y)),
                maxY: Math.max(...basePoints.map(p => p.y))
            };
        }

        // Main render function
        function render() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            drawGrid();

            // Draw buildings
            buildings.forEach(building => {
                drawBuilding(building);
            });

            // Highlight hovered building
            if (hoveredBuilding) {
                const { coords, height } = hoveredBuilding;
                const heightScale = zoom * 0.5;

                const topPoints = coords.map(c => {
                    const iso = toIsometric(c.x, c.y, height * heightScale);
                    return applyTransform(iso);
                });

                ctx.beginPath();
                ctx.moveTo(topPoints[0].x, topPoints[0].y);
                for (let i = 1; i < topPoints.length; i++) {
                    ctx.lineTo(topPoints[i].x, topPoints[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Draw background grid
        function drawGrid() {
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;

            const gridSize = 100;
            const range = 2000;

            for (let x = -range; x <= range; x += gridSize) {
                const start = toIsometric(x, -range, 0);
                const end = toIsometric(x, range, 0);
                const screenStart = applyTransform(start);
                const screenEnd = applyTransform(end);

                ctx.beginPath();
                ctx.moveTo(screenStart.x, screenStart.y);
                ctx.lineTo(screenEnd.x, screenEnd.y);
                ctx.stroke();
            }

            for (let y = -range; y <= range; y += gridSize) {
                const start = toIsometric(-range, y, 0);
                const end = toIsometric(range, y, 0);
                const screenStart = applyTransform(start);
                const screenEnd = applyTransform(end);

                ctx.beginPath();
                ctx.moveTo(screenStart.x, screenStart.y);
                ctx.lineTo(screenEnd.x, screenEnd.y);
                ctx.stroke();
            }
        }

        // Zoom controls
        function zoomIn() {
            zoom = Math.min(zoom * 1.3, 5);
            document.getElementById('zoom-level').textContent = zoom.toFixed(1) + 'x';
            render();
        }

        function zoomOut() {
            zoom = Math.max(zoom / 1.3, 0.3);
            document.getElementById('zoom-level').textContent = zoom.toFixed(1) + 'x';
            render();
        }

        function resetView() {
            zoom = 1;
            offsetX = 0;
            offsetY = 0;
            document.getElementById('zoom-level').textContent = '1.0x';
            render();
        }

        // Landmark navigation
        const landmarks = [
            { name: 'Gateway Arch', lat: 38.6247, lon: -90.1848 },
            { name: 'Busch Stadium', lat: 38.6226, lon: -90.1928 },
            { name: 'Union Station', lat: 38.6318, lon: -90.2068 },
            { name: 'City Hall', lat: 38.6291, lon: -90.1962 },
            { name: 'Forest Park', lat: 38.6366, lon: -90.2848 }
        ];
        let currentLandmark = 0;

        function goToLandmark() {
            const landmark = landmarks[currentLandmark];
            const screen = latLonToScreen(landmark.lat, landmark.lon);
            const iso = toIsometric(screen.x, screen.y, 0);

            offsetX = -iso.x * zoom;
            offsetY = -iso.y * zoom;

            currentLandmark = (currentLandmark + 1) % landmarks.length;

            document.querySelector('.landmarks-btn').textContent = landmark.name;
            setTimeout(() => {
                document.querySelector('.landmarks-btn').textContent = 'Landmarks';
            }, 2000);

            render();
        }

        // Mouse/touch handlers
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX += e.clientX - lastMouseX;
                offsetY += e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                render();
            } else {
                // Check for building hover
                const mouseX = e.clientX;
                const mouseY = e.clientY;

                hoveredBuilding = null;
                for (let i = buildings.length - 1; i >= 0; i--) {
                    const b = buildings[i];
                    if (b.screenBounds &&
                        mouseX >= b.screenBounds.minX && mouseX <= b.screenBounds.maxX &&
                        mouseY >= b.screenBounds.minY && mouseY <= b.screenBounds.maxY) {
                        if (b.name || b.tags?.['addr:street']) {
                            hoveredBuilding = b;
                            break;
                        }
                    }
                }

                const tooltip = document.getElementById('tooltip');
                if (hoveredBuilding) {
                    const name = hoveredBuilding.name || hoveredBuilding.tags?.['addr:street'] || 'Building';
                    const floors = Math.round(hoveredBuilding.height / 3.5);
                    document.getElementById('tooltip-name').textContent = name;
                    document.getElementById('tooltip-info').textContent = `~${floors} floors`;
                    tooltip.style.left = (mouseX + 15) + 'px';
                    tooltip.style.top = (mouseY + 15) + 'px';
                    tooltip.classList.add('show');
                } else {
                    tooltip.classList.remove('show');
                }

                render();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            document.getElementById('tooltip').classList.remove('show');
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            zoom = Math.max(0.3, Math.min(5, zoom * zoomFactor));
            document.getElementById('zoom-level').textContent = zoom.toFixed(1) + 'x';
            render();
        }, { passive: false });

        // Touch support
        let touchStartDist = 0;
        let touchStartZoom = 1;

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchStartZoom = zoom;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                offsetX += e.touches[0].clientX - lastMouseX;
                offsetY += e.touches[0].clientY - lastMouseY;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                render();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                zoom = Math.max(0.3, Math.min(5, touchStartZoom * (dist / touchStartDist)));
                document.getElementById('zoom-level').textContent = zoom.toFixed(1) + 'x';
                render();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            const panAmount = 50;
            switch(e.key) {
                case 'ArrowUp': offsetY += panAmount; render(); break;
                case 'ArrowDown': offsetY -= panAmount; render(); break;
                case 'ArrowLeft': offsetX += panAmount; render(); break;
                case 'ArrowRight': offsetX -= panAmount; render(); break;
                case '+': case '=': zoomIn(); break;
                case '-': zoomOut(); break;
                case 'r': resetView(); break;
                case 'l': goToLandmark(); break;
            }
        });

        // Initialize
        window.addEventListener('resize', resize);

        async function init() {
            resize();

            buildings = await fetchBuildings();

            document.getElementById('building-count').textContent = buildings.length.toLocaleString();
            document.getElementById('loading').style.display = 'none';

            render();
        }

        init();
    </script>
</body>
</html>
